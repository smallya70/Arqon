<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ARQON — programme view</title>
<style>
  :root{--ink:#0f172a;--body:#334155;--mute:#64748b;--faint:#94a3b8;--line:#cbd5e1;
        --hair:#e2e8f0;--page:#fafaf9;--mark:#f59e0b;--mark-bg:#fffbeb;--bad:#9f1239;
        --ok:#15803d;--rule:#0f172a}
  *{box-sizing:border-box}
  body{margin:0;background:var(--page);color:var(--ink);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  button{font:inherit;cursor:pointer;border:0;background:none}

  header{background:#fff;border-bottom:1px solid var(--line)}
  .bar{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 20px;
       padding:14px 28px;max-width:1180px;margin:0 auto}
  .brand{font-weight:600;letter-spacing:.03em}
  .client{font-size:15px;color:var(--body)}
  .ref{font-size:12px;color:var(--faint)}
  .lens{margin-left:auto;display:flex;gap:2px;border:1px solid var(--line)}
  .lens button{padding:6px 14px;font-size:12.5px;color:var(--body)}
  .lens button:hover{background:#f1f5f9}
  .lens button.on{background:var(--ink);color:#fff}

  main{max-width:1180px;margin:0 auto;padding:28px}
  .lensnote{border-left:2px solid var(--mark);background:var(--mark-bg);
            padding:12px 16px;font-size:13px;color:#78350f;margin:0 0 28px}

  section{margin:0 0 38px}
  h2{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--mute);
     font-weight:600;margin:0 0 14px;padding-bottom:8px;border-bottom:1px solid var(--line)}
  h3{font-size:15px;margin:0 0 4px}
  p.lead{color:var(--body);margin:0 0 16px;max-width:76ch}

  .figures{display:grid;gap:1px;background:var(--line);border:1px solid var(--line)}
  @media(min-width:760px){.figures{grid-template-columns:repeat(4,1fr)}}
  .fig{background:#fff;padding:16px 18px}
  .fig .n{font-size:30px;line-height:1.1;letter-spacing:-.02em}
  .fig .l{font-size:12.5px;color:var(--mute);margin-top:4px}
  .fig .s{font-size:12px;color:var(--faint);margin-top:6px}
  .fig.warn .n{color:var(--bad)}

  table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);font-size:14px}
  th{text-align:left;font-size:11.5px;letter-spacing:.03em;color:var(--mute);font-weight:500;
     padding:9px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:9px 14px;border-bottom:1px solid var(--hair);vertical-align:top}
  tr:last-child td{border-bottom:0}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  .sub{display:block;font-size:12px;color:var(--faint);margin-top:2px}
  .bad{color:var(--bad)}.ok{color:var(--ok)}.warnx{color:#92400e}

  .bar2{display:flex;height:8px;background:var(--hair);overflow:hidden;min-width:110px}
  .bar2 i{display:block;height:100%}
  .bar2 .r{background:var(--ink)}
  .bar2 .b{background:var(--mark)}

  .item{border:1px solid var(--line);background:#fff;padding:18px 20px;margin-bottom:12px}
  .item .id{font-size:11.5px;color:var(--mute)}
  .item p{margin:8px 0 0;color:var(--body);font-size:14px;max-width:78ch}
  .item .impact{margin-top:10px;font-size:13px;color:var(--ink)}
  .item .meta{margin-top:12px;font-size:12px;color:var(--faint)}
  .sev{font-size:11px;padding:2px 8px;color:#fff}
  .sev.high{background:#9f1239}.sev.medium{background:#c2410c}

  .pillrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .pill{font-size:11.5px;padding:2px 9px;border:1px solid var(--line);color:var(--body)}
  .pill.gap{border-color:var(--bad);color:var(--bad)}
  .pill.partial{border-color:var(--mark);color:#92400e}

  .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .scroll table{min-width:600px}
  .demo{background:#fef3c7;color:#78350f;font-size:12.5px;padding:8px 28px;
        border-bottom:1px solid #fde68a}
  .demo b{font-weight:600}
  tbody tr.pick{cursor:pointer}
  tbody tr.pick:hover{background:#f1f5f9}
  .rolebtn{font:inherit;text-align:left;padding:0;color:var(--ink);text-decoration:underline;
    text-underline-offset:3px;text-decoration-color:var(--faint)}
  .rolebtn:hover,.rolebtn:focus-visible{text-decoration-color:var(--ink)}
  .rolebtn:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
  @media(max-width:700px){
    .figures{grid-template-columns:repeat(2,1fr)}
    .bar{padding:12px 16px}main{padding:18px 16px}.demo{padding:8px 16px}
    footer div{padding:16px}
    h1{font-size:24px}.fig .n{font-size:24px}
    .lens{margin-left:0;width:100%}.lens button{flex:1;text-align:center}
  }
  .compose{border:1px solid var(--line);background:#fff;padding:18px 20px;margin-top:16px}
  .compose label{display:block;font-size:12.5px;color:var(--mute);margin-bottom:6px}
  .compose textarea{width:100%;min-height:84px;resize:vertical;padding:10px;font:inherit;
    font-size:14px;border:1px solid var(--line)}
  .compose textarea:focus{outline:0;border-color:var(--ink)}
  .acts{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:14px}
  .btn{display:inline-block;background:var(--ink);color:#fff;padding:9px 16px;font-size:13.5px;
    text-decoration:none}
  .btn:hover{background:#334155}
  .btn.ghost{background:transparent;color:var(--body);border:1px solid var(--line)}
  .btn.ghost:hover{background:#f8fafc}
  .link{color:var(--mute);font-size:13.5px;text-decoration:underline;text-underline-offset:2px}
  .inst{margin:14px 0 0;padding:12px 14px;background:#f8fafc;border:1px solid var(--hair);
    font:12.5px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;color:var(--body)}
  .caveat{margin:12px 0 0;font-size:12.5px;color:var(--faint);max-width:78ch}
  .navsep{width:1px;background:var(--line);margin:0 6px;align-self:stretch}
  .impgrid{display:grid;gap:16px}
  @media(min-width:860px){.impgrid{grid-template-columns:1fr 1fr}}
  .box{border:1px solid var(--line);background:#fff;padding:16px 18px}
  .box h3{margin:0 0 4px;font-size:15px}
  .box p{margin:0 0 12px;font-size:13px;color:var(--mute)}
  .box input[type=file]{font:inherit;font-size:13px;max-width:100%}
  textarea.rost{width:100%;min-height:120px;resize:vertical;padding:10px;border:1px solid var(--line);
    font:13px/1.5 ui-monospace,Menlo,Consolas,monospace}
  textarea.rost:focus{outline:0;border-color:var(--ink)}
  .tag{font-size:11px;padding:2px 8px;color:#fff;white-space:nowrap}
  .tag.confirmed{background:#15803d}.tag.reported{background:#b45309}
  .tag.conflict{background:#9f1239}.tag.uncertain{background:#7c3aed}
  .tag.unresolved,.tag.unparsed{background:#475569}
  .side{display:grid;gap:16px}
  @media(min-width:900px){.side{grid-template-columns:1fr 1fr}}
  .minih{font-size:13px;color:var(--mute);margin:0 0 8px}
  pre.out{margin:0;padding:14px;background:#fff;border:1px solid var(--line);max-height:400px;
    overflow:auto;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;color:var(--body)}
  .panel{border:1px solid var(--line);background:#fff;max-height:400px;overflow:auto}
  .psg{border-bottom:1px solid var(--hair);padding:9px 12px}
  .psg:last-child{border-bottom:0}
  .psg .m{display:flex;gap:8px;align-items:baseline;font-size:11.5px;flex-wrap:wrap}
  .psg .pid{color:var(--faint)}
  .psg p{margin:3px 0 0;font-size:13.5px;color:var(--body)}
  .err{border-left:2px solid var(--bad);background:#fff1f2;color:#881337;padding:10px 14px;
    font-size:13px;margin:12px 0 0}
  footer{border-top:1px solid var(--line);margin-top:20px}
  footer div{max-width:1180px;margin:0 auto;padding:18px 28px;font-size:13px;color:var(--mute)}
</style>
</head>
<body>
<div class="demo"><b>Demonstration — synthetic data.</b> A constructed programme for a fictional
client. Figures are illustrative and nothing here is connected to a live register, document store
or mailbox.</div>
<header><div class="bar">
  <span class="brand">ARQON</span>
  <span class="client" id="client"></span>
  <span class="ref" id="ref"></span>
  <span class="lens">
    <button data-lens="steering">Steering committee</button>
    <button data-lens="lead">Programme lead</button>
    <button data-lens="sponsor">Client sponsor</button>
    <span class="navsep"></span>
    <button data-lens="import" id="importtab">Import transcript</button>
  </span>
</div></header>
<main id="main"></main>
<footer><div id="foot"></div></footer>
<script>
/* One dataset. Both views derive every figure from it.

   Deliberately small: 4 completed workshops and 47 records, not the 200+ a real
   programme produces. Every number on every screen traces to a record below, so
   a reader can count them. A dashboard whose totals cannot be reconciled to its
   own data teaches people to distrust all of it.

   Synthetic throughout. Fictional client, constructed sessions. */

const PROGRAMME = {
  client: "Northbridge Group", name: "Consolidation replacement", ref: "PRG-001",
  phase: "Design", entities: 214, weeksElapsed: 9, weeksPlanned: 20,
};

/* Programme responsibility. Separate from corporate ownership: a parent company
   does not decide who approves an accounting treatment. */
const ROLES = [
  { role: "Accounting policy lead",      side: "client", email: "policy.lead@northbridge.example" },
  { role: "Group consolidation lead",    side: "client", email: "consolidation.lead@northbridge.example" },
  { role: "Group controller",            side: "client", email: "controller@northbridge.example" },
  { role: "Regional finance lead, EMEA", side: "client", email: "emea.finance@northbridge.example" },
  { role: "Regional finance lead, APAC", side: "client", email: "apac.finance@northbridge.example" },
  { role: "Finance control and audit",   side: "client", email: "control@northbridge.example" },
  { role: "Programme data architect",    side: "DI",     email: "data.architect@diintl.com" },
];

const WORKSHOPS = [
  { id:"W-038", title:"Entity structure and ownership", region:"Group", state:"done", date:"2026-07-14" },
  { id:"W-041", title:"Currency translation",           region:"EMEA",  state:"done", date:"2026-07-23" },
  { id:"W-042", title:"Intercompany and eliminations",  region:"EMEA",  state:"done", date:"2026-07-28" },
  { id:"W-043", title:"Minority interests and equity",  region:"Group", state:"done", date:"2026-08-04" },
  { id:"W-047", title:"Management reporting",           region:"Group", state:"scheduled", date:"2026-09-29" },
  { id:"W-048", title:"Controls and reconciliation",    region:"Group", state:"scheduled", date:"2026-10-06" },
  { id:"W-049", title:"Intercompany and eliminations",  region:"Americas", state:"scheduled", date:"2026-10-13" },
  { id:"W-050", title:"Migration and opening balances", region:"Group", state:"scheduled", date:"2026-10-20" },
];

/* W-042 in full, so the workshop view can show the transcript that produced its
   records and each record can cite the passage behind it. */
const PASSAGES = {
  "W-042": [
    ["P-001","14:28","Facilitator","Let's take intercompany submission. Walk me through what happens today."],
    ["P-002","14:29","Regional finance lead, EMEA","The European entities submit intercompany balances by account, but not by partner. It's never been a field in the local template."],
    ["P-003","14:31","Group controller","North America gives us partner detail. I pull both sides, match what I can in a spreadsheet, and chase the rest by email."],
    ["P-004","14:32","Facilitator","How long does that take you at close?"],
    ["P-005","14:32","Group controller","Two days. Three when the tolerances get argued. There's no agreed tolerance written down anywhere — I use fifty thousand euro as a rule of thumb but nobody has signed that off."],
    ["P-006","14:35","Accounting policy lead","That needs formalising. Different tolerance for trading balances versus loan balances, I'd expect. Loans should match exactly."],
    ["P-007","14:36","Group controller","Agreed. And we need to stop submissions arriving with no counterparty at all. Right now the system accepts them and I find out at day four."],
    ["P-008","14:38","Regional finance lead, EMEA","Two of the Spanish entities can't do that yet. They came in with last year's acquisition and they're still on their old ledger until the 2027 close. They'll have to upload manually."],
    ["P-009","14:39","Accounting policy lead","Fine as a documented exception, but it needs group sign-off, not a local arrangement."],
    ["P-010","14:42","Group controller","One more. The ownership register shows the Portuguese entity at sixty percent, but the consolidation workbook has treated it as an associate for two years. Somebody needs to tell me which is right before we design the elimination rules."],
    ["P-011","14:43","Facilitator","Who owns closing that?"],
    ["P-012","14:43","Accounting policy lead","I'll take it. I need legal to confirm the shareholder agreement first."],
  ].map(([id,t,who,text])=>({id,t,who,text})),
};

/* r(): id, workshop, kind, type, statement, owner, ownerOrigin, passages, quote,
        reviewStatus, blockers, ageDays */
const r = (id, ws, kind, type, statement, owner, ownerOrigin, passages, quote, reviewStatus, blockers, ageDays) =>
  ({ id, workshop: ws, kind, type, statement, owner, ownerOrigin, passages, quote,
     reviewStatus, blockers, ageDays });

const AP = "Accounting policy lead", GC = "Group consolidation lead", CTL = "Group controller",
      EMEA = "Regional finance lead, EMEA", APAC = "Regional finance lead, APAC",
      CTRL = "Finance control and audit", DA = "Programme data architect", NONE = null;

const RECORDS = [
  /* ---- W-042 intercompany: the seven the workshop view shows, plus five more ---- */
  r("IC-001","W-042","Requirement","Control","Reject intercompany submissions with no valid counterparty at the point of entry.",
    GC,"reviewer-added",["P-007"],"we need to stop submissions arriving with no counterparty at all",
    "Approved",["priority","acceptance criteria"],22),
  r("D-001","W-042","Decision","Policy","Loan balances match exactly, with no tolerance applied.",
    NONE,null,["P-006","P-007"],"Loans should match exactly","Approved",[],22),
  r("Q-001","W-042","Open question","n/a","What tolerance applies, and does it differ by balance type?",
    GC,"reviewer-added",["P-005","P-006"],"no agreed tolerance written down anywhere","Approved",["answer outstanding"],22),
  r("EX-001","W-042","Exception","Process","Two Spanish entities submit intercompany manually until the 2027 close.",
    NONE,null,["P-008","P-009"],"still on their old ledger until the 2027 close","Approved",["baseline rule","approver"],22),
  r("IS-001","W-042","Issue","n/a","The controller reports the ownership register at 60% while the consolidation workbook treats the entity as an associate.",
    CTL,"reviewer-added",["P-010"],"register shows sixty percent... treated it as an associate","Approved",["impact"],22),
  r("Q-002","W-042","Open question","n/a","Which treatment is correct for the Portuguese entity?",
    AP,"stated",["P-010","P-011","P-012"],"Somebody needs to tell me which is right","Approved",["answer outstanding"],22),
  r("A-001","W-042","Action","n/a","Confirm the Portuguese shareholder agreement with legal.",
    AP,"stated",["P-012"],"I need legal to confirm the shareholder agreement first","Approved",["due date"],22),
  r("IC-002","W-042","Requirement","Data","Capture counterparty on intercompany balances at account level.",
    EMEA,"reviewer-added",["P-002"],"submit by account, but not by partner","Approved",["acceptance criteria"],22),
  r("IC-003","W-042","Requirement","Functional","Match intercompany balances by entity, counterparty and account.",
    GC,"reviewer-added",["P-003"],"I pull both sides, match what I can","Approved",[],22),
  r("R-001","W-042","Risk","n/a","Manual intercompany matching consumes two to three days of the close.",
    CTL,"reviewer-added",["P-005"],"Two days. Three when the tolerances get argued","Approved",[],22),
  r("IC-004","W-042","Requirement","Workflow","Route unmatched intercompany differences to the owning entity for response.",
    GC,"reviewer-added",["P-003"],"chase the rest by email","Approved",["priority","acceptance criteria"],22),
  r("AS-001","W-042","Assumption","n/a","All EMEA entities can add a counterparty field to the local submission template.",
    EMEA,"reviewer-added",["P-002"],"It's never been a field in the local template","Approved",["validation date"],22),

  /* ---- W-038 entity structure and ownership ---- */
  r("IC-010","W-038","Requirement","Data","Hold entity ownership with effective dates so mid-period acquisitions consolidate from the acquisition date.",
    DA,"reviewer-added",["P-019"],"The system must hold entity ownership with effective dates","Approved",["entity scope"],41),
  r("Q-010","W-038","Open question","n/a","Can legal supply ownership data carrying effective dates?",
    CTL,"stated",["P-021"],"I don't know whether their system holds effective dates at all","Approved",["answer outstanding"],41),
  r("A-010","W-038","Action","n/a","Ask legal whether their system holds ownership effective dates.",
    CTL,"stated",["P-021"],"I'll ask","Approved",["due date"],41),
  r("IC-011","W-038","Requirement","Integration","Feed the ownership register extract into the consolidation model at least monthly.",
    DA,"reviewer-added",["P-017"],"I'd want the register to feed through monthly at least","Approved",["priority","acceptance criteria"],41),
  r("IS-010","W-038","Issue","n/a","A November acquisition did not reach the consolidation model until February.",
    GC,"reviewer-added",["P-016"],"didn't reach the consolidation model until February","Approved",["impact"],41),
  r("D-010","W-038","Decision","Policy","Entity master is maintained by Legal and consumed, not edited, by Finance.",
    NONE,null,["P-015"],"Legal maintains it","Approved",[],41),
  r("IC-012","W-038","Requirement","Data","Record the twelve entity archetypes against every subsidiary in the entity master.",
    DA,"reviewer-added",["P-022"],"we need a way to group them","Approved",["acceptance criteria"],41),
  r("Q-011","W-038","Open question","n/a","How are dormant and in-liquidation entities treated in the consolidation scope?",
    NONE,null,["P-024"],"what about the dormant ones","Approved",["owner","answer outstanding"],41),
  r("Q-012","W-038","Open question","n/a","Which entity codes are authoritative where ERP and legal registers disagree?",
    NONE,null,["P-026"],"the codes don't always line up","Approved",["owner","answer outstanding"],41),
  r("IC-013","W-038","Requirement","Migration","Load historic entity membership so prior-period comparatives restate correctly.",
    DA,"reviewer-added",["P-028"],"we'll need the history as well","Approved",["priority","entity scope"],41),
  r("R-010","W-038","Risk","n/a","Ownership data may not be supplied with effective dates, changing the elimination design.",
    DA,"reviewer-added",["P-021"],"I don't know whether their system holds effective dates","Approved",[],41),

  /* ---- W-041 currency translation ---- */
  r("IC-020","W-041","Requirement","Functional","Apply closing rate to balance sheet accounts and average rate to income statement accounts.",
    AP,"reviewer-added",["P-009"],"the system must apply closing rate to balance sheet accounts","Approved",["priority","acceptance criteria"],34),
  r("IC-021","W-041","Requirement","Control","Prevent local override of the translation rate applied to each account type.",
    CTRL,"reviewer-added",["P-009"],"with no local override. That needs to be enforced","Approved",["acceptance criteria","owner"],34),
  r("IC-022","W-041","Requirement","Regulatory","Restate hyperinflationary entities under IAS 29 before translating at closing rate.",
    AP,"reviewer-added",["P-010","P-011"],"Those restate first and then translate at closing","Approved",["priority","acceptance criteria"],34),
  r("Q-020","W-041","Open question","n/a","How is a permanent departure from the group translation baseline classified?",
    AP,"reviewer-added",["P-012","P-013"],"So yes, indefinite","Approved",["answer outstanding"],34),
  r("IS-020","W-041","Issue","n/a","Three APAC entities applied period-end rate to revenue contrary to group policy.",
    APAC,"reviewer-added",["P-003"],"three entities have been using period-end for revenue","Approved",["impact"],34),
  r("Q-021","W-041","Open question","n/a","Was Vietnam's revenue translation corrected, and when?",
    APAC,"reviewer-added",["P-005","P-006","P-008"],"We fixed Vietnam in March","Approved",["answer outstanding"],34),
  r("IC-023","W-041","Requirement","Reporting","Present the cumulative translation adjustment as a separate component of equity.",
    AP,"reviewer-added",["P-030"],"CTA has to show separately","Approved",["acceptance criteria"],34),
  r("Q-022","W-041","Open question","n/a","Should CTA reconciliation be performed in the system, and does the platform support it?",
    NONE,null,["P-030","P-031","P-032"],"I don't know what the platform supports","Approved",["owner","answer outstanding"],34),
  r("A-020","W-041","Action","n/a","Check platform support for CTA reconciliation before committing to it.",
    DA,"reviewer-added",["P-032"],"I'd want someone to check before we commit","Approved",["due date"],34),
  r("D-020","W-041","Decision","Policy","Hyperinflationary treatment applies to Turkey and Argentina only.",
    NONE,null,["P-011"],"Turkey and Argentina","Approved",[],34),
  r("AS-020","W-041","Assumption","n/a","Rate tables are supplied monthly by Treasury in a consistent format.",
    NONE,null,["P-034"],"Treasury send the rates","Approved",["owner","validation date"],34),

  /* ---- W-043 minority interests and equity ---- */
  r("IC-030","W-043","Requirement","Functional","Calculate non-controlling interests from ownership percentages rather than by manual journal.",
    AP,"reviewer-added",["P-025"],"NCI should be calculated by the system","Approved",["acceptance criteria"],28),
  r("IS-030","W-043","Issue","n/a","A manual NCI journal was posted wrong by about four hundred thousand and corrected at review.",
    CTL,"reviewer-added",["P-024"],"that journal was wrong by about four hundred thousand","Approved",["impact"],28),
  r("R-030","W-043","Risk","n/a","Manual NCI calculation is the largest manual risk in the close.",
    CTL,"reviewer-added",["P-027"],"the single biggest manual risk in the close","Approved",[],28),
  r("IC-031","W-043","Requirement","Reporting","Present non-controlling interests by entity in the group reporting pack.",
    NONE,null,["P-028"],"NCI split by entity in the reporting pack","Approved",["owner","priority"],28),
  r("Q-030","W-043","Open question","n/a","How are changes in ownership percentage without loss of control accounted for?",
    AP,"reviewer-added",["P-031"],"what happens when we buy up","Approved",["answer outstanding"],28),
  r("IC-032","W-043","Requirement","Functional","Recalculate non-controlling interests when ownership changes mid-period.",
    AP,"reviewer-added",["P-031"],"what happens when we buy up","Approved",["priority","acceptance criteria"],28),
  r("D-030","W-043","Decision","Policy","Equity-accounted entities are reported at a single line with no proportionate consolidation.",
    NONE,null,["P-033"],"one line, that's all we need","Approved",[],28),
  r("EX-030","W-043","Exception","Process","The Kessler joint venture is proportionately consolidated until the 2027 review.",
    NONE,null,["P-035"],"proportionate for the JV until we revisit","Approved",["baseline rule","approver","end date"],28),
  r("Q-031","W-043","Open question","n/a","Which entities carry a shareholder agreement that overrides the ownership percentage?",
    AP,"reviewer-added",["P-036"],"there are agreements that change it","Approved",["answer outstanding"],28),
  r("IC-033","W-043","Requirement","Control","Reconcile the non-controlling interest balance to the ownership register each close.",
    CTRL,"reviewer-added",["P-037"],"we'd want that tied back","Approved",["acceptance criteria","owner"],28),
  r("A-030","W-043","Action","n/a","Obtain the shareholder agreements for the four entities with disputed percentages.",
    NONE,null,["P-036"],"there are agreements that change it","Approved",["owner","due date"],28),
  r("AS-030","W-043","Assumption","n/a","Ownership percentages in the register are current as at the reporting date.",

/* Everything both views display, computed from RECORDS. Nothing is stated twice.

   The rule: if a figure appears on a screen, it is derived here. A hardcoded
   total is a figure that can drift from its own data, and a reader who catches
   one stops believing the rest. */



/* Only analyst-reviewed records count towards programme figures. Anything still
   in the queue has not been confirmed as an accurate capture. */
const approved = RECORDS.filter(r => r.reviewStatus === "Approved");
const inQueue  = RECORDS.filter(r => r.reviewStatus !== "Approved");

const isReady = (r) => r.blockers.length === 0;

const byKind = () => {
  const m = new Map();
  for (const r of approved) {
    if (!m.has(r.kind)) m.set(r.kind, { kind: r.kind, total: 0, ready: 0, blocked: 0, blockers: new Set() });
    const k = m.get(r.kind);
    k.total++;
    isReady(r) ? k.ready++ : k.blocked++;
    r.blockers.forEach(b => k.blockers.add(b));
  }
  return [...m.values()]
    .map(k => ({ ...k, blockers: [...k.blockers].join(", ") || "—" }))
    .sort((a, b) => b.total - a.total);
};

const byOwner = () => {
  const m = new Map();
  for (const r of approved.filter(r => !isReady(r))) {
    const role = r.owner || "Unassigned";
    if (!m.has(role)) m.set(role, { role, count: 0, oldestDays: 0, subjects: new Set() });
    const o = m.get(role);
    o.count++;
    o.oldestDays = Math.max(o.oldestDays, r.ageDays);
    const ws = WORKSHOPS.find(w => w.id === r.workshop);
    if (ws) o.subjects.add(ws.title);
  }
  return [...m.values()]
    .map(o => ({
      ...o,
      side: ROLES.find(x => x.role === o.role)?.side || "—",
      email: ROLES.find(x => x.role === o.role)?.email || "",
      subjects: [...o.subjects].join(", "),
    }))
    .sort((a, b) => b.count - a.count || b.oldestDays - a.oldestDays);
};

const blockedFor = (role) =>
  approved.filter(r => !isReady(r) && (r.owner || "Unassigned") === role);

const recordsFor = (workshopId) => RECORDS.filter(r => r.workshop === workshopId);

const workshopRows = () => WORKSHOPS.map(w => {
  const rs = recordsFor(w.id).filter(r => r.reviewStatus === "Approved");
  return {
    ...w,
    records: rs.length,
    questions: rs.filter(r => r.kind === "Open question").length,
  };
});

const coverage = () => ARCHETYPES.map(([name, entities, workshops]) => ({
  name, entities, workshops,
  status: workshops.length === 0 ? "gap"
        : workshops.some(id => recordsFor(id).some(r => r.blockers.length)) ? "partial"
        : "covered",
  note: workshops.length ? `established in ${workshops.join(", ")}` : "no workshop covers this yet",
}));

const totals = () => {
  const k = byKind(), o = byOwner();
  const done = WORKSHOPS.filter(w => w.state === "done");
  const t = {
    workshopsDone: done.length,
    workshopsTotal: WORKSHOPS.length,
    records: approved.length,
    ready: approved.filter(isReady).length,
    blocked: approved.filter(r => !isReady(r)).length,
    queue: inQueue.length,
    clientBlocked: o.filter(x => x.side === "client").reduce((n, x) => n + x.count, 0),
    diBlocked:     o.filter(x => x.side === "DI").reduce((n, x) => n + x.count, 0),
    unassigned:    o.find(x => x.role === "Unassigned")?.count || 0,
    oldestDays: Math.max(0, ...o.map(x => x.oldestDays)),
    gaps: coverage().filter(c => c.status === "gap").length,
    openQuestions: approved.filter(r => r.kind === "Open question").length,
  };
  t.fromWorkshops = workshopRows().reduce((n, w) => n + w.records, 0);
  t.fromKinds     = k.reduce((n, x) => n + x.total, 0);
  /* Identities that must hold. Checked rather than assumed. */
  t.reconciled =
    t.records === t.fromWorkshops &&
    t.records === t.fromKinds &&
    t.ready + t.blocked === t.records &&
    t.clientBlocked + t.diBlocked + t.unassigned === t.blocked;
  return t;
};

/* Transcript structuring. No model, no network, no credentials.

   Produces passages with repeatable IDs and speakers resolved against a roster
   the user supplies. Resolves nothing it was not told: a name absent from the
   roster stays unresolved, and an explicit uncertainty marker never acquires a
   designation, because a designation decides whether a statement can be a
   decision at all. */

const SCHEMA = "arqon.transcript/1";

/* A content fingerprint, not a cryptographic hash. Deterministic, so the same
   file always yields the same passage IDs and drift is detectable. */
function fingerprint(text){
  let h1 = 0x811c9dc5, h2 = 0x01000193;
  for (let i = 0; i < text.length; i++){
    const c = text.charCodeAt(i);
    h1 = Math.imul(h1 ^ c, 0x01000193) >>> 0;
    h2 = Math.imul(h2 + c, 0x85ebca6b) >>> 0;
  }
  return (h1.toString(16).padStart(8,"0") + h2.toString(16).padStart(8,"0")).slice(0,12);
}

const TURN = /^(?:\[?(\d{1,2}:\d{2}(?::\d{2})?)\]?)?\s*([^:]{1,64}):\s*(.+)$/;
const PAREN = /^(.+?)\s*\(([^)]+)\)\s*$/;
const UNCERTAIN = /\buncertain\b|\bunsure\b|unidentified|unknown speaker|inaudible|speaker\s*\d|\?\s*$/i;
const DOUBT = /probably|i think it was|sorry,? who|who was that/i;

/* Designations routinely contain commas — "Regional finance lead, EMEA" — so a
   naive split truncates exactly the fields that matter. */
function splitCsv(line){
  const out = [];
  let cur = "", inQuotes = false;
  for (let i = 0; i < line.length; i++){
    const c = line[i];
    if (c === '"'){
      if (inQuotes && line[i + 1] === '"'){ cur += '"'; i++; }
      else inQuotes = !inQuotes;
    } else if (c === "," && !inQuotes){ out.push(cur.trim()); cur = ""; }
    else cur += c;
  }
  out.push(cur.trim());
  return { fields: out, unclosedQuote: inQuotes };
}

/* roster: [{name, designation}] */
function parseRoster(text){
  const rows = [], errors = [];
  const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  const seen = new Map();
  for (const [i, line] of lines.entries()){
    if (i === 0 && /^name\s*,/i.test(line)) continue;           // header
    const { fields, unclosedQuote } = splitCsv(line);
    if (unclosedQuote){
      errors.push(`Line ${i + 1}: unclosed quote — "${line.slice(0, 48)}"`);
      continue;
    }
    if (fields.length < 2 || !fields[0] || !fields[1]){
      errors.push(`Line ${i + 1}: expected "name, designation" — got "${line.slice(0, 48)}"`);
      continue;
    }
    /* A designation containing a comma must be quoted. Taking the first two
       fields and discarding the rest turns "Regional finance lead, EMEA" into
       "Regional finance lead" with nothing said — the kind of loss nobody
       notices until a record is routed to the wrong region. */
    if (fields.length > 2 && fields.slice(2).some(f => f !== "")){
      errors.push(`Line ${i + 1}: ${fields.length} fields. If the designation contains a comma, ` +
                  `quote it: ${fields[0]}, "${fields.slice(1).join(", ")}"`);
      continue;
    }
    const [name, designation] = fields;
    const k = name.toLowerCase();
    if (seen.has(k) && seen.get(k).toLowerCase() !== designation.toLowerCase()){
      errors.push(`"${name}" is listed twice with different designations: ` +
                  `"${seen.get(k)}" and "${designation}". Resolve before importing.`);
      continue;
    }
    seen.set(k, designation);
    rows.push({ name, designation });
  }
  return { roster: rows, errors };
}

function resolve(label, roster){
  const s = label.trim();
  const base = { raw: s, designation: "", rosterDesignation: "", inlineDesignation: "" };
  if (UNCERTAIN.test(s)){
    const m = PAREN.exec(s);
    if (m) base.inlineDesignation = m[1].trim();
    return { ...base, certainty: "uncertain", why: "explicit uncertainty marker — no designation assigned" };
  }
  const byName = new Map(roster.map(r => [r.name.toLowerCase(), r.designation]));
  const designations = new Set(roster.map(r => r.designation.toLowerCase()));

  const m = PAREN.exec(s);
  if (m){
    const role = m[1].trim(), name = m[2].trim();
    base.inlineDesignation = role;
    const rd = byName.get(name.toLowerCase());
    if (rd === undefined)
      return { ...base, designation: role, certainty: "reported",
               why: `designation given in the transcript; "${name}" is not on the roster` };
    base.rosterDesignation = rd;
    if (rd.toLowerCase() !== role.toLowerCase())
      return { ...base, certainty: "conflict",
               why: `transcript says "${role}", roster says "${rd}" — neither is used` };
    return { ...base, designation: role, certainty: "confirmed", why: "confirmed against the roster" };
  }
  const rd = byName.get(s.toLowerCase());
  if (rd !== undefined)
    return { ...base, designation: rd, rosterDesignation: rd, certainty: "confirmed", why: "matched on the roster" };
  if (designations.has(s.toLowerCase()))
    return { ...base, designation: s, inlineDesignation: s, certainty: "reported",
             why: "a designation was given directly; there is no name to confirm it against" };
  const near = nearMatches(s, roster);
  return { ...base, certainty: "unresolved", suggestions: near,
           why: near.length
             ? `not on the roster. Similar entries: ${near.map(n => `"${n.name}" (${n.designation})`).join("; ")}`
               + ". Confirm or add to the roster — this is a suggestion, not a match."
             : "not on the roster and no designation given" };
}

/* A transcript says "D. Ahmed"; the roster says "Dele Ahmed". Suggest, never
   resolve: a wrong designation decides whether a statement can be a decision,
   and two sources that merely look alike are not confirmation. */
function nearMatches(label, roster){
  const tokens = (s) => s.toLowerCase().replace(/[.,]/g, " ").split(/\s+/).filter(Boolean);
  const a = tokens(label);
  if (!a.length) return [];
  const surname = a[a.length - 1];
  return roster.filter(r => {
    const b = tokens(r.name);
    if (!b.length) return false;
    if (b[b.length - 1] !== surname) return false;      // same surname
    if (a.length === 1 || b.length === 1) return true;
    return a[0][0] === b[0][0];                          // and same first initial
  }).slice(0, 3);
}

/* A passage ID is unique within a document, not across documents: two
   transcripts both have a P-001. Anything citing a passage — a record, a
   finding, an email — must use the document-scoped ref below. */
const passageRef = (fingerprint, id) => `${fingerprint}/${id}`;

function structure(text, { roster = [], filename = "transcript.txt", workshop = "" } = {}){
  const fp = fingerprint(text);
  const lines = text.split(/\r?\n/);
  const passages = [];
  let n = 0;

  for (const [i, raw] of lines.entries()){
    const line = raw.trim();
    if (!line) continue;
    n++;
    const id = `P-${String(n).padStart(3, "0")}`;
    const m = TURN.exec(line);
    if (!m){
      passages.push({ id, ref: passageRef(fp, id), sourceLine: i + 1, time: "", speaker: null,
                      text: line, parse: "unparsed", why: "did not match [time] Speaker: text" });
      continue;
    }
    const sp = resolve(m[2], roster);
    passages.push({ id, ref: passageRef(fp, id), sourceLine: i + 1, time: m[1] || "",
                    speaker: sp, text: m[3].trim(), parse: "ok" });
  }

  /* A later turn casting doubt marks the nearby speaker uncertain. Never resolves it. */
  passages.forEach((p, i) => {
    if (p.parse === "ok" && DOUBT.test(p.text))
      passages.slice(Math.max(0, i - 3), i).forEach(q => {
        if (q.speaker?.certainty === "uncertain") q.speaker.why += `; doubt raised at ${p.id}`;
      });
  });

  const speakers = new Map();
  for (const p of passages){
    if (!p.speaker) continue;
    const k = p.speaker.raw;
    if (!speakers.has(k)) speakers.set(k, { ...p.speaker, passages: [] });
    speakers.get(k).passages.push(p.id);
  }

  const issues = [];
  for (const s of speakers.values())
    if (s.certainty !== "confirmed")
      issues.push({ type: "speaker", certainty: s.certainty, speaker: s.raw,
                    detail: s.why, suggestions: s.suggestions || [], passages: s.passages });
  for (const p of passages)
    if (p.parse === "unparsed")
      issues.push({ type: "line", passage: p.id, detail: p.why,
                    text: p.text.slice(0, 60) });

  return {
    schema: SCHEMA,
    source: { filename, fingerprint: fp, bytes: text.length, lines: lines.length,
              importedAt: new Date().toISOString(), workshop: workshop || null },
    roster,
    passages,
    speakers: [...speakers.values()],
    issues,
    state: issues.length ? "prepared with unresolved items" : "prepared",
  };
}

  });
  el("rfile")?.addEventListener("change", e => {
    const f = e.target.files[0];
    if (f) readFile(f, text => { IMP.rosterText = text; render(CURRENT); });
  });
  el("sample")?.addEventListener("click", () => {
    IMP.text = SAMPLE_TRANSCRIPT; IMP.filename = "sample-session.txt";
    IMP.workshop = IMP.workshop || "W-049"; IMP.structured = null; render(CURRENT);
  });
  el("rsample")?.addEventListener("click", () => { IMP.rosterText = SAMPLE_ROSTER; render(CURRENT); });
  el("rroles")?.addEventListener("click", () => { IMP.rosterText = rosterFromProgramme(); render(CURRENT); });
  el("roster")?.addEventListener("input", e => {
    IMP.rosterText = e.target.value;
    if (IMP.structured && !IMP.stale){ invalidate(); markStale(); }
  });
  el("wref")?.addEventListener("input", e => {
    IMP.workshop = e.target.value;
    if (IMP.structured && !IMP.stale){ invalidate(); markStale(); }
  });

  el("go")?.addEventListener("click", () => {
    const { roster, errors } = parseRoster(IMP.rosterText || "");
    IMP.workshop = el("wref").value.trim();
    IMP.rosterErrors = errors;
    /* A roster contradicting itself would resolve a speaker cleanly and wrongly. */
    if (errors.some(e => /listed twice/.test(e))){ render(CURRENT); return; }
    IMP.structured = structure(IMP.text, { roster, filename: IMP.filename || "pasted.txt",
                                           workshop: IMP.workshop });
    IMP.stale = false;
    render(CURRENT);
    document.querySelector("#main section:nth-of-type(2)")?.scrollIntoView({behavior:"smooth",block:"start"});
  });

  el("dl")?.addEventListener("click", () => {
    const blob = new Blob([JSON.stringify(IMP.structured, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = (IMP.structured.source.workshop || "transcript") + "-structured.json";
    a.click(); URL.revokeObjectURL(a.href);
  });
  el("cp")?.addEventListener("click", e => {
    navigator.clipboard?.writeText(JSON.stringify(IMP.structured, null, 2))
      .then(() => { e.target.textContent = "Copied";
        setTimeout(() => { e.target.textContent = "Copy JSON"; }, 1500); }, () => {});
  });
}

const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const T = totals(), KINDS = byKind(), OWNERS = byOwner(), WS = workshopRows(), COV = coverage();

const LENS = {
  steering: {
    note: "Steering view. What this committee is being asked to settle, and progress against plan. " +
          "Delivery mechanics are not shown.",
    foot: "Every figure on this page is counted from the " + T.records + " records in the register. " +
          "In the product each opens the workshop passage that produced it."
  },
  lead: {
    note: "Programme lead view. Everything, including the review queue and archetype coverage.",
    foot: "Blocked records are the number that matters. Nothing moves until the fields named against " +
          "each record are supplied by its owner."
  },
  sponsor: {
    note: "Client view. Progress on your programme and what is outstanding with your people. " +
          "Our internal delivery figures are not shown here.",
    foot: "Outstanding items sit with named roles in your organisation. In the product each opens " +
          "the record and the passage it came from."
  },
};

const fig = (n,l,s,warn) =>
  `<div class="fig${warn?" warn":""}"><div class="n">${n}</div><div class="l">${l}</div>${
    s?`<div class="s">${s}</div>`:""}</div>`;

function headline(lens){
  const pct = Math.round(T.ready/T.records*100);
  if(lens==="steering") return `<section><div class="figures">
    ${fig(`${T.workshopsDone} of ${T.workshopsTotal}`,"workshops held",`week ${PROGRAMME.weeksElapsed} of ${PROGRAMME.weeksPlanned}`)}
    ${fig(T.records,"records captured","typed, evidenced, analyst-reviewed")}
    ${fig(`${pct}%`,"complete enough to sign off",`${T.blocked} still blocked`,pct<70)}
    ${fig(T.openQuestions,"questions unanswered","each blocking design work",true)}
  </div></section>`;
  if(lens==="sponsor") return `<section><div class="figures">
    ${fig(`${T.workshopsDone} of ${T.workshopsTotal}`,"workshops held",`next: ${WS.find(w=>w.state==="scheduled").date}`)}
    ${fig(T.records,"records captured","from your sessions")}
    ${fig(T.clientBlocked,"items awaiting your people","by role, below",true)}
    ${fig(T.oldestDays,"days, oldest outstanding item","with one role",true)}
  </div></section>`;
  return `<section><div class="figures">
    ${fig(`${T.workshopsDone}/${T.workshopsTotal}`,"workshops processed",`week ${PROGRAMME.weeksElapsed} of ${PROGRAMME.weeksPlanned}`)}
    ${fig(T.records,"records",`ready ${T.ready} · blocked ${T.blocked}`)}
    ${fig(T.queue,"in the review queue","not counted above",T.queue>10)}
    ${fig(T.gaps,"archetypes with no workshop",`of ${COV.length}`,T.gaps>0)}
  </div></section>`;
}

const kinds = () => `<section><h2>Records by kind</h2>
  <p class="lead">A record is ready when every field its kind requires has been supplied. Most
  blockers are fields nobody stated in the session; a reviewer supplies them, they are never inferred.</p>
  <div class="scroll"><table><thead><tr><th>Kind</th><th class="num">Total</th><th class="num">Ready</th>
    <th class="num">Blocked</th><th style="width:150px"></th><th>Waiting on</th></tr></thead>
  <tbody>${KINDS.map(k=>`<tr><td>${k.kind}</td><td class="num">${k.total}</td>
    <td class="num ok">${k.ready}</td><td class="num ${k.blocked?"bad":""}">${k.blocked}</td>
    <td><span class="bar2"><i class="r" style="width:${k.ready/k.total*100}%"></i>
        <i class="b" style="width:${k.blocked/k.total*100}%"></i></span></td>
    <td style="font-size:13px;color:var(--mute)">${esc(k.blockers)}</td></tr>`).join("")}
  </tbody></table></div></section>`;

function owners(lens){
  const rows = lens==="sponsor" ? OWNERS.filter(o=>o.side==="client") : OWNERS;
  return `<section><h2>${lens==="sponsor"?"Outstanding with your people":"Blocked records by owner"}</h2>
  <p class="lead">${lens==="sponsor"
    ? "Each needs a field supplied, a question answered or an approval given."
    : "Age is the oldest outstanding item for that role."}</p>
  <div class="scroll"><table><thead><tr><th>Role</th>${lens!=="sponsor"?"<th>Side</th>":""}
    <th class="num">Blocked</th><th class="num">Oldest</th><th>Subjects</th></tr></thead>
  <tbody>${rows.map(o=>`<tr>
    <td><button class="rolebtn" data-role="${esc(o.role)}" aria-controls="action">${esc(o.role)}</button>
        <span class="sub">prepare an instruction</span></td>
    ${lens!=="sponsor"?`<td style="font-size:13px;color:var(--mute)">${o.side}</td>`:""}
    <td class="num ${o.count>8?"bad":""}">${o.count}</td>
    <td class="num ${o.oldestDays>30?"bad":""}">${o.oldestDays}d</td>
    <td style="font-size:13px;color:var(--body)">${esc(o.subjects)}</td></tr>`).join("")}
  </tbody></table></div>
  ${T.unassigned?`<p class="lead" style="margin-top:12px">
    <span class="bad">${T.unassigned} records have no owner at all</span>${lens==="sponsor"
      ?", so they are not counted against any role above":""}. Nobody was named in the session and no
    reviewer has assigned one. They are invisible to everyone until someone is.</p>`:""}
  </section>`;
}

const workshops = lens => `<section><h2>Workshops</h2>
  <div class="scroll"><table><thead><tr><th>Ref</th><th>Subject</th><th>Region</th><th>Date</th>
    <th class="num">Records</th>${lens!=="sponsor"?'<th class="num">Open questions</th>':""}
    <th>Status</th></tr></thead>
  <tbody>${WS.map(w=>`<tr>
    <td class="mono" style="font-size:12.5px">${w.id}</td><td>${esc(w.title)}</td>
    <td style="font-size:13px;color:var(--mute)">${w.region}</td>
    <td class="mono" style="font-size:12.5px">${w.date}</td>
    <td class="num">${w.records||"—"}</td>
    ${lens!=="sponsor"?`<td class="num ${w.questions?"warnx":""}">${w.questions||"—"}</td>`:""}
    <td style="font-size:13px" class="${w.state==="done"?"ok":""}">${w.state}</td></tr>`).join("")}
  </tbody></table></div>
  <p class="lead" style="margin-top:10px">Records shown are analyst-reviewed. ${T.queue} further
  ${T.queue===1?"candidate is":"candidates are"} in the review queue and counted nowhere above.</p>
  </section>`;

const archetypes = () => `<section><h2>Entity archetype coverage</h2>
  <p class="lead">${PROGRAMME.entities} entities reduced to ${COV.length} patterns. A gap means no
  workshop has covered how those entities are treated.</p>
  <div class="scroll"><table><thead><tr><th>Archetype</th><th class="num">Entities</th>
    <th>Coverage</th><th>Evidence</th></tr></thead>
  <tbody>${COV.map(c=>`<tr><td>${esc(c.name)}</td><td class="num">${c.entities}</td>
    <td><span class="pill ${c.status==="covered"?"":c.status}">${c.status}</span></td>
    <td style="font-size:13px;color:var(--mute)">${esc(c.note)}</td></tr>`).join("")}
  </tbody></table></div></section>`;

const queue = () => `<section><h2>Review queue</h2>
  <p class="lead">Extractions waiting on a human to accept, edit or reject. Nothing here counts
  towards any figure above until it has been reviewed.</p>
  <div class="scroll"><table><thead><tr><th>Analyst</th><th class="num">Waiting</th><th>Position</th></tr></thead>
  <tbody>${ANALYST_QUEUE.map(([who,n,note])=>`<tr><td>${esc(who)}</td>
    <td class="num ${n>10?"bad":n?"":"ok"}">${n||"—"}</td>
    <td style="font-size:13px;color:var(--body)">${esc(note)}</td></tr>`).join("")}
  </tbody></table></div></section>`;

/* ---- prepare an instruction ---- */
let ACTION = { role: null };
const NOTES = {};
const noteFor = r => NOTES[r] || "";

function mailBody(role, recs, note){
  return [`${role},`, "",
    note.trim() || "The records below are outstanding with you.", "",
    ...recs.flatMap(r => [`${r.id}  (${r.kind})`, `   ${r.statement}`,
      `   outstanding: ${r.blockers.join(", ")}`, ""]),
    `From the ${PROGRAMME.client} ${PROGRAMME.name} register (${PROGRAMME.ref}).`].join("\n");
}

const instructionFor = (role, recs) =>
  `Draft a notification to the ${role} on ${PROGRAMME.ref} for records `
  + recs.map(r=>r.id).join(", ")
  + (noteFor(role).trim() ? `.\nContext for you when you review the draft: ${noteFor(role).trim()}` : ".");

function actionPanel(){
  const role = ACTION.role;
  if(!role) return "";
  const recs = blockedFor(role), o = OWNERS.find(x=>x.role===role);
  const to = o?.email || "";
  const subject = `${PROGRAMME.client}: ${recs.length} record${recs.length===1?"":"s"} outstanding with you`;
  const href = `mailto:${encodeURIComponent(to)}?subject=${encodeURIComponent(subject)}`
             + `&body=${encodeURIComponent(mailBody(role, recs, noteFor(role)))}`;
  return `<section id="action">
    <h2>Prepare an instruction — ${esc(role)}</h2>
    <p class="lead">${o?`${o.count} blocked, oldest ${o.oldestDays} days.`:""}
    Nothing is sent from this page. It prepares two things: a message in your own mail application,
    or an instruction for ARQON to draft from the register with evidence attached.</p>
    ${recs.length?`<div class="scroll"><table><thead><tr><th>Record</th><th>Kind</th>
      <th>Statement</th><th>Outstanding</th><th>Evidence</th></tr></thead><tbody>
      ${recs.map(r=>`<tr><td class="mono" style="font-size:12.5px">${r.id}</td>
        <td style="font-size:13px;color:var(--mute)">${r.kind}</td><td>${esc(r.statement)}</td>
        <td style="font-size:13px" class="warnx">${esc(r.blockers.join(", "))}</td>
        <td class="mono" style="font-size:12px;color:var(--faint)">${r.workshop} ${r.passages.join(", ")}</td>
        </tr>`).join("")}</tbody></table></div>`
     : `<p class="lead">No blocked records against this role.</p>`}
    <div class="compose">
      <label for="note">Your instruction — optional. Included verbatim in the mail message; passed to
      the analyst as context for the ARQON route.</label>
      <textarea id="note" placeholder="e.g. We need these before the design review on the 14th.">${esc(noteFor(role))}</textarea>
      <div class="acts">
        <a class="btn" href="${href}">Open in email app</a>
        <button class="btn ghost" data-copy="1">Copy instruction for ARQON</button>
        <button class="link" data-close="1">Close</button>
      </div>
      <pre class="inst" id="inst">${esc(instructionFor(role, recs))}</pre>
      <p class="caveat"><strong>What each does.</strong> “Open in email app” hands the text to
      whatever mail application this machine is set to use. It composes a message; it creates no draft
      here and logs nothing. Your note is included verbatim.<br><br>
      The ARQON instruction is for the analyst to paste into the register. The draft it produces uses
      a fixed server-side template and cites the workshop passage behind every record — which is why
      <strong>your note is carried as context for the analyst, not inserted into that email</strong>.
      Both leave the sending to a person.</p>
    </div></section>`;
}

let CURRENT = "lead";

function render(lens){
  /* The importer is a tool, not a lens: it shows no programme figures and
     contributes none. Kept on the same page so the lead has one place to work. */
  if(lens === "import"){
    document.getElementById("client").textContent = `${PROGRAMME.client} · ${PROGRAMME.name}`;
    document.getElementById("ref").textContent = `${PROGRAMME.ref} · tool`;
    document.querySelectorAll(".lens button").forEach(b=>b.classList.toggle("on", b.dataset.lens==="import"));
    document.getElementById("main").innerHTML = importView();
    document.getElementById("foot").textContent =
      "Structuring a transcript produces no records. Classification runs separately, and its output " +
      "is reviewed by an analyst before it counts towards anything on the other views.";
    bindImport();
    return;
  }
  document.getElementById("client").textContent = `${PROGRAMME.client} · ${PROGRAMME.name}`;
  document.getElementById("ref").textContent = `${PROGRAMME.ref} · ${PROGRAMME.phase} phase`;
  document.querySelectorAll(".lens button").forEach(b=>b.classList.toggle("on", b.dataset.lens===lens));
  const parts = [`<p class="lensnote">${LENS[lens].note}</p>`, headline(lens)];
  if(lens==="steering") parts.push(kinds(), owners(lens), actionPanel(), workshops(lens));
  if(lens==="sponsor")  parts.push(owners(lens), actionPanel(), workshops(lens));
  if(lens==="lead")     parts.push(queue(), owners(lens), actionPanel(), kinds(), archetypes(), workshops(lens));
  if(!T.reconciled)
    parts.push(`<p class="lensnote" style="border-color:#9f1239;background:#fff1f2;color:#881337">
      Figures on this page do not reconcile to the underlying records. Do not rely on them.</p>`);
  document.getElementById("main").innerHTML = parts.join("");
  document.getElementById("foot").textContent = LENS[lens].foot;
}

document.addEventListener("click", e=>{
  const lensBtn = e.target.closest("[data-lens]");
  if(lensBtn){ CURRENT = lensBtn.dataset.lens; ACTION = {role:null}; render(CURRENT); return; }
  if(e.target.closest("[data-close]")){ ACTION = {role:null}; render(CURRENT); return; }
  if(e.target.closest("[data-copy]")){
    const text = document.getElementById("inst").textContent;
    navigator.clipboard?.writeText(text).then(
      ()=>{ e.target.textContent="Copied"; setTimeout(()=>{e.target.textContent="Copy instruction for ARQON";},1600); },
      ()=>{});
    return;
  }
  const roleBtn = e.target.closest("button[data-role]");
  if(roleBtn){
    ACTION = { role: roleBtn.dataset.role };
    render(CURRENT);
    document.getElementById("action")?.scrollIntoView({behavior:"smooth",block:"start"});
    document.getElementById("note")?.focus();
  }
});

document.addEventListener("input", e=>{
  if(e.target.id!=="note") return;
  NOTES[ACTION.role] = e.target.value;
  const recs = blockedFor(ACTION.role);
  const inst = document.getElementById("inst");
  if(inst) inst.textContent = instructionFor(ACTION.role, recs);
  const link = document.querySelector("#action a.btn");
  if(link){
    const o = OWNERS.find(x=>x.role===ACTION.role);
    const subject = `${PROGRAMME.client}: ${recs.length} record${recs.length===1?"":"s"} outstanding with you`;
    link.href = `mailto:${encodeURIComponent(o?.email||"")}?subject=${encodeURIComponent(subject)}`
              + `&body=${encodeURIComponent(mailBody(ACTION.role, recs, noteFor(ACTION.role)))}`;
  }
});

render(CURRENT);

</script>
</body>
</html>
